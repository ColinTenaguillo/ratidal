[package]
name = "ratidal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A terminal client for TIDAL, with hi-res playback"
repository = "https://github.com/ColinTenaguillo/ratidal"
homepage = "https://github.com/ColinTenaguillo/ratidal"
readme = "README.md"
keywords = ["tidal", "tui", "music", "player", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
# The floor our dependencies set: ratatui 0.30 needs 1.88, rodio 1.87,
# quick-xml 1.86. Raise this only after checking those again.
rust-version = "1.88"
# The README's screenshot. crates.io rewrites the relative link to GitHub, so
# the crate need not carry the PNG.
exclude = ["/docs"]

[lib]
name = "ratidal"
path = "src/lib.rs"

[[bin]]
name = "ratidal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Needed for EventStream, which ratatui's crossterm re-export does not expose.
# MUST track ratatui's crossterm version, or KeyEvent becomes two distinct types.
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3"
image = "0.25"
quick-xml = "0.42.0"
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
# `rustls` is the feature name in reqwest 0.13 (it was `rustls-tls` in 0.12).
# `blocking` is required: SegmentReader runs on the audio thread, not the runtime.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking", "form", "query"] }
# Pinned EXACTLY: 0.22.0/0.22.1 ship a buffer-size regression that produces
# silence. Do not relax this pin without testing that audio still comes out.
# 0.22 also renamed the public API (Sink->Player, OutputStream->MixerDeviceSink),
# so every example you find online will fail to compile.
rodio = { version = "=0.22.2", features = ["symphonia-flac", "symphonia-isomp4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The OS media keys. MPRIS is a D-Bus interface, so it is Linux-only by
# definition; macOS has its own below.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"

# Only to drive the MPRIS interface from the test suite, as a desktop would.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5"

# macOS has no MPRIS. Its media keys go to whatever registered with
# MPRemoteCommandCenter, which needs a Core Foundation run loop on the main
# thread -- see src/shell/mediakeys_macos.rs.
[target.'cfg(target_os = "macos")'.dependencies]
mediaplayer = "0.4.3"
# The Core Foundation run loop. Held at 0.7 by the lockfile: mediaplayer
# 0.4.3 builds against 0.7's CGRect and fails against 0.9's.
apple-cf = "0.7"


[dev-dependencies]
insta = "1"

# Debug info is most of what a test build spends its time writing and
# linking: six binaries at 28k lines of it. Line tables alone still name
# the file and line in a panic, which is all a failing test needs.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The dependencies are built once and then not touched. Optimising them
# costs that one build and makes every test run after it faster -- the
# image and audio decoding in particular.
[profile.dev.package."*"]
opt-level = 2
debug = false
