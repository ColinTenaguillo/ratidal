[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# rodio needs ALSA's headers to build on Linux, as ci.yml installs them.
[dist.dependencies.apt]
pkg-config = "*"
libasound2-dev = "*"

# mediaplayer's Swift bridge is written against the macOS 26 SDK, which
# only Xcode 26 has, so dist's default Apple images (macos-14 for arm64,
# macos-15 for Intel) cannot compile it. Both Apple targets build on the
# arm64 macOS 26 image; the Intel one is cross-compiled there, which the
# bridge's `swift build --triple` allows. The binaries still run from
# macOS 12: the newer calls sit behind availability checks.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26"
